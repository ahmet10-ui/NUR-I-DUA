
name: NUR-I DUA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Python 3.10 for Chaquopy
        run: |
          PYTHON310_PATH="$(command -v python3.10)"
          if [ -z "$PYTHON310_PATH" ]; then
            echo "ERROR: python3.10 not found on PATH" >&2
            exit 1
          fi
          echo "Resolved python3.10: $PYTHON310_PATH"
          "$PYTHON310_PATH" --version
          python3 --version
          echo "CHAQUOPY_BUILD_PYTHON=$PYTHON310_PATH" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"


      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android APK
        run: |
          echo "Using CHAQUOPY_BUILD_PYTHON=$CHAQUOPY_BUILD_PYTHON"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NUR-I-DUA-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
